[package]
name = "codex-code-router"
version = "1.0.0-local.3"
edition = "2021"
license = "MIT"
description = "Experimental local Codex router for native OpenAI and GitHub Copilot."
repository = "https://github.com/c-mongan/codex-copilot-router-public"
publish = false
keywords = ["codex", "copilot", "proxy", "responses"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.103"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
futures-util = "0.3"
http = "1"
httpdate = "1"
libc = "0.2"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"